name: Deploy Chit to EC2

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy Chit
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CHIT_EC2_SSH_PRIVATE_KEY }}
          CHIT_API_KEY: ${{ secrets.CHIT_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/chit-github-deploy
          chmod 600 ~/.ssh/chit-github-deploy

          ssh -F none \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/chit-github-deploy \
            "${EC2_USER}@${EC2_HOST}" \
            "AWS_REGION='${AWS_REGION}' ECR_REGISTRY='${ECR_REGISTRY}' ECR_REPOSITORY='${ECR_REPOSITORY}' CHIT_API_KEY='${CHIT_API_KEY}' bash -s" << 'REMOTE'

              set -e

              ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

              echo "Logging in to Amazon ECR..."

              aws ecr get-login-password --region "${AWS_REGION}" \
                | docker login \
                    --username AWS \
                    --password-stdin \
                    "${ECR_REGISTRY}"

              echo "Pulling latest Chit image..."

              docker pull "${ECR_IMAGE}"

              echo "Stopping existing Chit container..."

              docker stop chit || true
              docker rm chit || true

              echo "Starting new Chit container..."

              docker run -d \
                --name chit \
                -p 127.0.0.1:8000:8000 \
                --restart unless-stopped \
                -e CHIT_API_KEY="${CHIT_API_KEY}" \
                "${ECR_IMAGE}"

              echo "Waiting for Chit..."

              sleep 5

              echo "Checking Chit health..."

              curl --fail http://127.0.0.1:8000/health

              echo
              echo "Deployment successful."

          REMOTE
