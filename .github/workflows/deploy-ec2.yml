name: Deploy Chit to EC2

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy Chit
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CHIT_EC2_SSH_PRIVATE_KEY }}
          CHIT_API_KEY: ${{ secrets.CHIT_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/chit-github-deploy
          chmod 600 ~/.ssh/chit-github-deploy

          ssh -F none \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/chit-github-deploy \
            "${EC2_USER}@${EC2_HOST}" \
            "AWS_REGION='${AWS_REGION}' \
             ECR_REGISTRY='${ECR_REGISTRY}' \
             ECR_REPOSITORY='${ECR_REPOSITORY}' \
             CHIT_API_KEY='${CHIT_API_KEY}' \
             bash -s" << 'REMOTE'

            set -euo pipefail

            CHIT_HOME="/opt/chit"
            ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

            echo "Preparing persistent directories..."

            mkdir -p \
              "${CHIT_HOME}/data" \
              "${CHIT_HOME}/configs" \
              "${CHIT_HOME}/checkpoints"

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login \
                  --username AWS \
                  --password-stdin \
                  "${ECR_REGISTRY}"

            echo "Pulling latest Chit image..."

            docker pull "${ECR_IMAGE}"

            echo "Stopping existing Chit container..."

            docker stop chit >/dev/null 2>&1 || true
            docker rm chit >/dev/null 2>&1 || true

            echo "Starting Chit..."

            docker run -d \
              --name chit \
              -p 127.0.0.1:8000:8000 \
              -p 127.0.0.1:8001:8001 \
              --restart unless-stopped \
              -v "${CHIT_HOME}/data:/app/data" \
              -v "${CHIT_HOME}/configs:/app/configs:ro" \
              -v "${CHIT_HOME}/checkpoints:/app/checkpoints" \
              -e CHIT_API_KEY="${CHIT_API_KEY}" \
              -e CHIT_UI_BASE_PATH=/console \
              "${ECR_IMAGE}" >/dev/null

            echo "Waiting for Chit..."

            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 \
                && curl -fsS http://127.0.0.1:8001/ >/dev/null 2>&1; then

                echo
                echo "Deployment successful."
                exit 0
              fi

              sleep 2
            done

            echo
            echo "Chit did not become healthy in 60 seconds."
            echo
            echo "Last container logs:"
            docker logs --tail 60 chit || true

            exit 1

          REMOTE
