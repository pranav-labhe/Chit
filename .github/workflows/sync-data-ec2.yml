name: Sync Chit Data to EC2

# Copies configs/ and the training text from git to the server's bind-mounted folders.
# No Docker deploy happens here: the running container sees the files through its mounts.
#   - configs/*.json are read by the API on every POST /train, so a config change is live at once.
#   - training text is read when a training job starts.
#
# One-time setup (repository variables):
#   EC2_HOST      host name or IP of the server
#   EC2_USER      SSH user
#   EC2_HOST_KEY  the server's host key, one line, checked by you once:  ssh-keyscan -t ed25519 <EC2_HOST>
#   CHIT_HOME     optional, default /opt/chit
# Secret: CHIT_EC2_SSH_PRIVATE_KEY

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to sync"
        type: choice
        options:
          - configs-and-data
          - configs-only
          - data-only
        default: configs-and-data
      prune_configs:
        description: "Also delete configs on the server that were removed from git (kept in the backup folder)"
        type: boolean
        default: false
      dry_run:
        description: "Show what would change and copy nothing"
        type: boolean
        default: false
      force_unlock:
        description: "Clear stale server filesystem lock (.sync.lock) if present before syncing (only if server is idle)"
        type: boolean
        default: false
  # Note: Configs and data are synced strictly via manual workflow_dispatch to avoid rollout race conditions.

permissions:
  contents: read

# Shares one queue with the deploy workflow so the two never touch the server at the same time.
concurrency:
  group: chit-ec2
  cancel-in-progress: false

jobs:
  sync:
    name: Sync configs and data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CHIT_HOME: ${{ vars.CHIT_HOME || '/opt/chit' }}
      CHIT_API_KEY: ${{ secrets.CHIT_API_KEY }}
      # Files under data/ that are synced (shell patterns, matched at any depth).
      # Never synced: databases, memory.json, *.bak, checkpoints.
      DATA_PATTERNS: "*.txt *.jsonl memory_seed.json chit-bpe-v1.json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_PRUNE: ${{ inputs.prune_configs }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_FORCE_UNLOCK: ${{ inputs.force_unlock }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            scope=configs-only; prune=false; dry=false; force_unlock=false
          else
            scope="$IN_SCOPE"; prune="$IN_PRUNE"; dry="$IN_DRY"; force_unlock="${IN_FORCE_UNLOCK:-false}"
          fi

          case "$scope" in
            configs-and-data) c=true;  d=true  ;;
            configs-only)     c=true;  d=false ;;
            data-only)        c=false; d=true  ;;
            *) echo "::error::unknown scope: $scope"; exit 1 ;;
          esac

          case "$CHIT_HOME" in
            /*) ;;
            *) echo "::error::CHIT_HOME must be an absolute path"; exit 1 ;;
          esac
          if ! printf '%s' "$CHIT_HOME" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::CHIT_HOME may only contain letters, digits, dot, dash, underscore and slash"; exit 1
          fi

          {
            echo "SYNC_CONFIGS=$c"
            echo "SYNC_DATA=$d"
            echo "PRUNE_CONFIGS=$prune"
            echo "DRY_RUN=$dry"
            echo "FORCE_UNLOCK=$force_unlock"
            echo "SYNC_TS=$(date -u +%Y%m%dT%H%M%SZ)"
          } >> "$GITHUB_ENV"

          echo "Event: $EVENT_NAME | scope: $scope | prune: $prune | dry run: $dry | force unlock: $force_unlock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configs and data
        run: |
          set -euo pipefail
          # Uses the project's own config checker (no install needed: it only needs Python).
          PYTHONPATH=. python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          from pranav.chit.config import ConfigError, load_config

          errors = 0
          def error(msg, file=None):
              global errors; errors += 1
              print(f"::error{' file=' + file if file else ''}::{msg}")
          def warn(msg, file=None): print(f"::warning{' file=' + file if file else ''}::{msg}")

          sync_configs = os.environ["SYNC_CONFIGS"] == "true"
          sync_data = os.environ["SYNC_DATA"] == "true"
          patterns = os.environ["DATA_PATTERNS"].split()

          def synced(path: Path) -> bool:
              return any(path.match(p) for p in patterns)

          if sync_configs:
              files = sorted(p for p in Path("configs").rglob("*") if p.is_file() and not p.name.endswith(("~", ".bak", ".swp")) and p.name != ".DS_Store")
              if not files:
                  error("configs/ has no files")
              print(f"{'config':26} {'layers':>6} {'width':>5} {'block':>5} {'batch':>5} {'steps':>6} {'dropout':>7}  device")
              for f in files:
                  if f.suffix != ".json":
                      warn("not a .json file: the server only reads *.json from configs/", str(f)); continue
                  if not re.fullmatch(r"[A-Za-z0-9_-]{1,64}", f.stem):
                      error("file name must be letters, digits, _ or - (up to 64): the API will refuse this config name", str(f)); continue
                  try:
                      cfg = load_config(f)
                  except (ConfigError, OSError, UnicodeDecodeError) as e:
                      error(str(e), str(f)); continue
                  m, t = cfg.model, cfg.training
                  print(f"{f.stem:26} {m.n_layer:>6} {m.n_embd:>5} {m.block_size:>5} {t.batch_size:>5} {t.max_steps:>6} {m.dropout:>7}  {cfg.device}")
                  if m.dropout > 0 and cfg.device in ("cpu", "auto"):
                      print(f"::notice file={f}::dropout {m.dropout} makes CPU training steps about 3x slower in a measured run; consider 0 for CPU-only servers")
                  for label, name in (("train_file", cfg.data.train_file), ("eval_file", cfg.data.eval_file)):
                      p = Path(name)
                      if p.is_file():
                          if p.stat().st_size <= m.block_size:
                              error(f"data.{label} ({name}) is {p.stat().st_size} bytes; it must be larger than model.block_size ({m.block_size})", str(f))
                          if not synced(p):
                              warn(f"data.{label} ({name}) does not match DATA_PATTERNS, so it will not be synced", str(f))
                      else:
                          warn(f"data.{label} ({name}) is not in the repository; it must already exist on the server", str(f))

          if sync_data:
              total = 0
              for p in sorted(Path("data").rglob("*")):
                  if p.is_file() and synced(p) and not p.name.endswith((".bak", "~", ".swp")):
                      total += p.stat().st_size
                      try:
                          p.read_text(encoding="utf-8")
                      except UnicodeDecodeError:
                          error("not valid UTF-8 text", str(p))
                      if p.stat().st_size == 0:
                          warn("file is empty", str(p))
              print(f"data files to sync: {total / 1024:.1f} KB")
              if total > 50 * 1024 * 1024:
                  warn("more than 50 MB of data files; consider copying very large corpora by hand")

          sys.exit(1 if errors else 0)
          PY

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CHIT_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_HOST_KEY: ${{ vars.EC2_HOST_KEY }}
        run: |
          set -euo pipefail

          [ -n "${SSH_PRIVATE_KEY:-}" ] || { echo "::error::secret CHIT_EC2_SSH_PRIVATE_KEY is empty"; exit 1; }
          [ -n "${EC2_HOST:-}" ] && [ -n "${EC2_USER:-}" ] || { echo "::error::repository variables EC2_HOST and EC2_USER are required"; exit 1; }
          if [ -z "${EC2_HOST_KEY:-}" ]; then
            echo "::error::repository variable EC2_HOST_KEY is empty. Run  ssh-keyscan -t ed25519 $EC2_HOST  once, check the key, and save the line as the variable."
            exit 1
          fi
          printf '%s' "$EC2_HOST" | grep -Eq '^[A-Za-z0-9._:-]+$'       || { echo "::error::EC2_HOST has unexpected characters"; exit 1; }
          printf '%s' "$EC2_USER" | grep -Eq '^[a-z_][a-z0-9_-]*$'      || { echo "::error::EC2_USER has unexpected characters"; exit 1; }

          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/chit_key"
          printf '%s\n' "$EC2_HOST_KEY"    > "$HOME/.ssh/chit_known_hosts"

          ssh-keygen -F "$EC2_HOST" -f "$HOME/.ssh/chit_known_hosts" > /dev/null \
            || { echo "::error::EC2_HOST_KEY has no key for $EC2_HOST"; exit 1; }

          cat > "$HOME/.ssh/chit_config" <<EOF
          Host chit-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile $HOME/.ssh/chit_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/chit_known_hosts
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          echo "SSH_CFG=$HOME/.ssh/chit_config" >> "$GITHUB_ENV"
          echo "SYNC_LOCK_ID=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}" >> "$GITHUB_ENV"

      - name: Check the server
        run: |
          set -euo pipefail

          out="$(ssh -F "$SSH_CFG" chit-ec2 "CHIT_HOME='$CHIT_HOME' DRY_RUN='$DRY_RUN' SYNC_DATA='$SYNC_DATA' SYNC_CONFIGS='$SYNC_CONFIGS' SYNC_LOCK_ID='$SYNC_LOCK_ID' FORCE_UNLOCK='$FORCE_UNLOCK' bash -s" <<'REMOTE'
          set -euo pipefail
          command -v rsync >/dev/null || { echo "ERROR: rsync is not installed on the server" >&2; exit 1; }

          # Create the folders; if the user cannot (for example /opt is root-owned), try sudo without a password.
          for d in "$CHIT_HOME" "$CHIT_HOME/data" "$CHIT_HOME/configs" "$CHIT_HOME/backups"; do
            [ -d "$d" ] || mkdir -p "$d" 2>/dev/null || sudo -n mkdir -p "$d"
          done
          for d in "$CHIT_HOME/data" "$CHIT_HOME/configs" "$CHIT_HOME/backups"; do
            [ -w "$d" ] || sudo -n chown "$(id -u):$(id -g)" "$d" 2>/dev/null || true
            [ -w "$d" ] || { echo "ERROR: $d is not writable by $(id -un). Run once on the server: sudo chown $(id -un): $d" >&2; exit 1; }
          done

          # Check container state via docker with strict disambiguation
          container_running="unknown"
          if command -v docker >/dev/null 2>&1; then
            inspect_out=""
            if inspect_out="$(docker inspect -f '{{.State.Running}}' chit 2>&1)"; then
              container_running="$inspect_out"
            else
              if echo "$inspect_out" | grep -Eiq 'no such (container|object)'; then
                container_running="not_found"
              else
                container_running="ambiguous"
                echo "docker inspect failed unexpectedly: $inspect_out" >&2
              fi
            fi
          else
            container_running="no_docker"
          fi
          echo "CONTAINER_STATE=$container_running"

          if [ "$container_running" = "ambiguous" ] || [ "$container_running" = "unknown" ] || [ "$container_running" = "no_docker" ]; then
            echo "ERROR: Cannot verify Docker container state (container_running=$container_running). Aborting to prevent data corruption." >&2
            exit 1
          fi

          was_running="false"
          lock_file="$CHIT_HOME/data/.sync.lock"

          cleanup_lock() {
            if [ -f "$lock_file" ]; then
              if [ "$(head -n 1 "$lock_file" 2>/dev/null || true)" = "$SYNC_LOCK_ID" ]; then
                rm -f "$lock_file"
                echo "Cleaned up pre-sync maintenance lock: $lock_file (owner: $SYNC_LOCK_ID)"
              fi
            fi
          }

          if [ "$SYNC_DATA" = "true" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              if [ -f "$lock_file" ]; then
                existing="$(head -n 1 "$lock_file" 2>/dev/null || true)"
                if [ "${FORCE_UNLOCK:-false}" = "true" ]; then
                  echo "FORCE_UNLOCK requested. Evaluating lock safety for '$existing'..."
                  if [ "$container_running" = "true" ]; then
                    if ! health="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health 2>/dev/null)"; then
                      echo "ERROR: Cannot verify server health (/health unreachable). Refusing to force unlock while container is running." >&2
                      exit 1
                    fi
                    if printf '%s' "$health" | grep -Eq '"training_job" *: *"[^"]+"'; then
                      echo "ERROR: Cannot force unlock: a training job is actively running in the container. Aborting." >&2
                      exit 1
                    fi
                    if echo "$existing" | grep -Eq '^api-pretokenize-'; then
                      if printf '%s' "$health" | grep -Eq '"data_locked" *: *true'; then
                        echo "ERROR: Cannot force unlock: an 'api-pretokenize' job is actively running in the container. Aborting." >&2
                        exit 1
                      fi
                    fi
                  fi
                  rm -f "$lock_file"
                  echo "Stale lock '$existing' cleared successfully under FORCE_UNLOCK."
                else
                  echo "GATE_LOCK=conflict_fs:$existing"
                  echo "ERROR: Server filesystem already locked by '$existing'. Aborting." >&2
                  echo "Hint: If this lock was left by an aborted or failed run, re-run with workflow input 'force_unlock: true'." >&2
                  exit 1
                fi
              fi

              # Step 1: Acquire atomic lock BEFORE checking health or stopping the container
              if ( set -C; printf '%s\n' "$SYNC_LOCK_ID" > "$lock_file" ) 2>/dev/null; then
                echo "GATE_LOCK=acquired_fs"
              else
                existing="$(head -n 1 "$lock_file" 2>/dev/null || true)"
                echo "GATE_LOCK=conflict_fs:$existing"
                echo "ERROR: Server filesystem already locked by '$existing'. Aborting." >&2
                exit 1
              fi

              # Verify ownership
              current_owner="$(head -n 1 "$lock_file" 2>/dev/null || true)"
              if [ "$current_owner" != "$SYNC_LOCK_ID" ]; then
                echo "ERROR: Lock ownership verification failed (got '$current_owner', expected '$SYNC_LOCK_ID'). Aborting." >&2
                exit 1
              fi
            else
              echo "GATE_LOCK=dry_run"
            fi

            # Step 2: Under lock protection, check container health and activity
            if [ "$container_running" = "true" ]; then
              if health="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health 2>/dev/null)"; then
                if printf '%s' "$health" | grep -Eq '"training_job" *: *"[^"]+"'; then
                  echo "ERROR: A training job is currently active. Offline data sync cannot proceed while training is in progress. Aborting." >&2
                  cleanup_lock
                  exit 1
                fi
              else
                echo "WARNING: /health endpoint did not respond, but container is running."
              fi

              if [ "$DRY_RUN" != "true" ]; then
                echo "Stopping 'chit' container under lock protection for offline data sync..."
                if ! docker stop -t 30 chit; then
                  echo "ERROR: Failed to stop 'chit' container. Aborting data sync." >&2
                  cleanup_lock
                  exit 1
                fi
                was_running="true"
              else
                echo "Dry run: would stop 'chit' container for offline data sync."
                was_running="true"
              fi
            else
              echo "Container 'chit' is not running ($container_running)."
              was_running="false"
            fi
          else
            # Configs-only sync: container remains online
            if [ "$container_running" = "true" ]; then
              if health="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health 2>/dev/null)"; then
                if printf '%s' "$health" | grep -Eq '"training_job" *: *"[^"]+"'; then
                  echo "TRAINING_ACTIVE=yes"
                else
                  echo "TRAINING_ACTIVE=no"
                fi
              else
                echo "TRAINING_ACTIVE=unknown"
              fi
            fi
          fi

          echo "WAS_RUNNING=$was_running"
          REMOTE
          )"
          echo "$out"
          was_running="$(printf '%s\n' "$out" | grep '^WAS_RUNNING=' | cut -d= -f2- || echo "false")"
          echo "WAS_RUNNING=$was_running" >> "$GITHUB_ENV"

          if printf '%s\n' "$out" | grep -q '^TRAINING_ACTIVE=yes'; then
            echo "::warning::A training job is running; configs will take effect when the next job starts."
          fi

      - name: Sync data files
        if: env.SYNC_DATA == 'true'
        run: |
          set -euo pipefail

          args=(-rltp --chmod=D755,F644 --checksum --itemize-changes --prune-empty-dirs
                --exclude='*.bak' --exclude='*~' --exclude='.*.swp' --exclude='.DS_Store'
                --include='*/')
          for p in $DATA_PATTERNS; do args+=(--include="$p"); done
          args+=(--exclude='*'
                 --backup --backup-dir="$CHIT_HOME/backups/sync-$SYNC_TS/data")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)

          # No --delete here: text that exists only on the server (for example from POST /data/split) is never removed.
          rsync "${args[@]}" -e "ssh -F $SSH_CFG" data/ "chit-ec2:$CHIT_HOME/data/" | tee /tmp/rsync-data.log

      - name: Sync configs
        if: env.SYNC_CONFIGS == 'true'
        run: |
          set -euo pipefail

          args=(-rltp --chmod=D755,F644 --checksum --itemize-changes
                --exclude='*.bak' --exclude='*~' --exclude='.*.swp' --exclude='.DS_Store'
                --backup --backup-dir="$CHIT_HOME/backups/sync-$SYNC_TS/configs")
          [ "$PRUNE_CONFIGS" = "true" ] && args+=(--delete)
          [ "$DRY_RUN" = "true" ]       && args+=(--dry-run)

          rsync "${args[@]}" -e "ssh -F $SSH_CFG" configs/ "chit-ec2:$CHIT_HOME/configs/" | tee /tmp/rsync-configs.log

      - name: Verify checksums on the server
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail

          skip=(! -name '*.bak' ! -name '*~' ! -name '.*.swp' ! -name '.DS_Store')
          : > /tmp/manifest.txt

          if [ "$SYNC_DATA" = "true" ]; then
            expr=(\( )
            for p in $DATA_PATTERNS; do
              [ "${#expr[@]}" -gt 1 ] && expr+=(-o)
              if [[ "$p" == *"/"* ]]; then
                expr+=(-path "*$p")
              else
                expr+=(-name "$p")
              fi
            done
            expr+=(\))
            find data -type f "${expr[@]}" "${skip[@]}" -print0 | sort -z | xargs -0 -r sha256sum >> /tmp/manifest.txt
          fi
          if [ "$SYNC_CONFIGS" = "true" ]; then
            find configs -type f "${skip[@]}" -print0 | sort -z | xargs -0 -r sha256sum >> /tmp/manifest.txt
          fi

          n="$(wc -l < /tmp/manifest.txt | tr -d ' ')"
          if [ "$n" -eq 0 ]; then echo "Nothing to verify."; exit 0; fi

          # One SSH call for all files (the checks run on the server, against the copies the container sees).
          ssh -F "$SSH_CFG" chit-ec2 "cd '$CHIT_HOME' && sha256sum -c --quiet -" < /tmp/manifest.txt
          echo "Verified $n file(s): server copies match git."

      - name: Restart container
        if: env.DRY_RUN != 'true' && env.WAS_RUNNING == 'true' && success()
        run: |
          set -euo pipefail
          echo "Restarting 'chit' container..."
          ssh -F "$SSH_CFG" chit-ec2 "docker start chit"

          echo "Waiting for Chit API /health to become ready..."
          ready=false
          for i in $(seq 1 15); do
            if ssh -F "$SSH_CFG" chit-ec2 "curl -fsS --max-time 3 http://127.0.0.1:8000/health" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" = "true" ]; then
            echo "Chit API is online and healthy."
          else
            echo "::error::Chit API did not answer /health within 30s after restart."
            exit 1
          fi

      - name: Remove old backups and check the app
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # Retain only the 5 most recent sync backups safely to protect disk space
          ssh -F "$SSH_CFG" chit-ec2 "find '$CHIT_HOME/backups' -mindepth 1 -maxdepth 1 -type d -name 'sync-*' | sort -r | tail -n +6 | while read -r old_dir; do [ -n \"\$old_dir\" ] && rm -rf \"\$old_dir\"; done" || true
          ssh -F "$SSH_CFG" chit-ec2 "curl -fsS --max-time 5 http://127.0.0.1:8000/health" || echo "::warning::Chit did not answer /health (is the container running?)"
          echo

      - name: Summary
        if: always()
        run: |
          {
            echo "## Chit data sync"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Server folder | \`${CHIT_HOME:-?}\` |"
            echo "| Configs synced | ${SYNC_CONFIGS:-?} (prune: ${PRUNE_CONFIGS:-?}) |"
            echo "| Data synced | ${SYNC_DATA:-?} |"
            echo "| Force unlock | ${FORCE_UNLOCK:-false} |"
            echo "| Dry run | ${DRY_RUN:-?} |"
            for part in configs data; do
              log="/tmp/rsync-$part.log"
              [ -f "$log" ] || continue
              changed="$(grep -E '^(>|\*deleting|cd\+)' "$log" | grep -v '^cd' || true)"
              echo
              echo "### $part: changed files"
              if [ -n "$changed" ]; then echo '```'; echo "$changed"; echo '```'; else echo "No file differed from git."; fi
            done
            if [ "${DRY_RUN:-}" != "true" ] && [ -n "${SYNC_TS:-}" ]; then
              echo
              echo "Replaced or deleted files were saved on the server under \`${CHIT_HOME:-?}/backups/sync-${SYNC_TS}/\` (kept 30 days)."
            fi
            echo
            echo "Data sync is performed offline with atomic filesystem locking. Configs are read dynamically on POST /train."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release maintenance lock
        if: env.DRY_RUN == 'true' || success()
        run: |
          if [ -f "${SSH_CFG:-}" ] && [ -n "${SYNC_LOCK_ID:-}" ]; then
            ssh -F "$SSH_CFG" chit-ec2 "CHIT_HOME='$CHIT_HOME' SYNC_LOCK_ID='$SYNC_LOCK_ID' bash -s" <<'REMOTE'
            set -euo pipefail
            lock_file="$CHIT_HOME/data/.sync.lock"
            if [ -f "$lock_file" ]; then
              current_id="$(head -n 1 "$lock_file" 2>/dev/null || true)"
              if [ "$current_id" = "$SYNC_LOCK_ID" ]; then
                rm -f "$lock_file"
                echo "Maintenance lock released on disk: $lock_file (owner: $SYNC_LOCK_ID)"
              else
                echo "Maintenance lock not released: owned by another process (owner: '$current_id', expected: '$SYNC_LOCK_ID')"
              fi
            else
              echo "Maintenance lock not present on disk: $lock_file"
            fi
          REMOTE
          fi

      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/chit_key" "$HOME/.ssh/chit_config" "$HOME/.ssh/chit_known_hosts"
